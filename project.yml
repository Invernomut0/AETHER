name: AETHER
options:
  bundleIdPrefix: com.aether
  deploymentTarget:
    macOS: "14.0"
packages:
  AETHERPackage:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.aether.desktop
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete
    OTHER_SWIFT_FLAGS: "$(inherited) -parse-as-library"
    MARKETING_VERSION: "1.0.6"
    CURRENT_PROJECT_VERSION: "7"
targets:
  AETHERApp:
    type: application
    platform: macOS
    sources:
      - path: Applications/AETHERApp
    dependencies:
      - package: AETHERPackage
        product: AETHERInterface
    settings:
      base:
        PRODUCT_NAME: AETHER
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        INFOPLIST_KEY_NSSupportsAutomaticGraphicsSwitching: YES
        INFOPLIST_KEY_NSScreenCaptureUsageDescription: "AETHER captures selected windows to render temporary visual effects after you grant permission."
        CODE_SIGN_ENTITLEMENTS: Configuration/AETHER.entitlements
  AETHERTestLab:
    type: application
    platform: macOS
    sources:
      - path: Applications/AETHERTestLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aether.testlab
        PRODUCT_NAME: AETHER Test Lab
